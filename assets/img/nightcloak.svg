<svg width="400" height="116" viewBox="0 0 400 116" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&amp;display=swap');
  </style>

  <!-- window -->
  <rect width="400" height="116" fill="#0D1117" rx="10"/>
  <!-- title bar -->
  <rect width="400" height="38" fill="#161B22" rx="10"/>
  <rect y="30" width="400" height="8" fill="#161B22"/>
  <!-- traffic lights -->
  <circle cx="22" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="19" r="6" fill="#28C840"/>

  <!-- prompt -->
  <text x="24" y="89"
    font-family="JetBrains Mono, monospace"
    font-weight="700"
    font-size="40px"
    fill="#4AFF91">❯</text>

  <!-- command -->
  <text x="68" y="89"
    font-family="JetBrains Mono, monospace"
    font-weight="800"
    font-size="40px"
    fill="#FFFFFF"
    letter-spacing="-1px">nightcloak</text>

  <!-- blinking cursor -->
  <rect x="326" y="57" width="22" height="36" fill="#4AFF91" rx="2">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
